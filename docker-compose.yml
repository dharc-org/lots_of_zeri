version: "3.9"

services:

  # ─── 1. Costruzione indice (eseguito una sola volta) ─────
  qlever-indexer:
      image: adfreiburg/qlever:latest
      container_name: zac-qlever-indexer
      user: root
      entrypoint: ["bash", "-c"]
      command:
        - |
          if [ -f /index/.build_done ]; then
            echo 'Indice già presente, skip.';
          else
            echo 'Costruzione indice...' &&
            qlever-index -p false \
              -s /data/settings.json \
              -m "3 GB" \
              --vocabulary-type on-disk-compressed \
              -f /data/zac_catalogues_metadata_8_7_2026.ttl -F ttl \
              -f /data/additional_metadata.ttl -F ttl \
              -f /data/lots_chuncks/zac_lot_descriptions_part1.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part2.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part3.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part4.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part5.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part6.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part7.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part8.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part9.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part10.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part11.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part12.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part13.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part14.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part15.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part16.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part17.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part18.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part19.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part20.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part21.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part22.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part23.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part24.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part25.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part26.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part27.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part28.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part29.nt -F nt \
              -f /data/lots_chuncks/zac_lot_descriptions_part30.nt -F nt \
              -i /index/zac &&
            touch /index/.build_done &&
            echo 'Indice costruito.';
          fi
      volumes:
        - ./data:/data:ro
        - qlever-index:/index
      networks:
        - zac-net

  # ─── 2. QLever Server ────────────────────────────────────
  qlever:
    image: adfreiburg/qlever:latest
    container_name: zac-qlever
    restart: unless-stopped
    user: root
    entrypoint: ["bash", "-c"]
    command:
      - |
        qlever-server \
          -i /index/zac \
          -p 7001 \
          -m "2 GB" \
          -c "1 GB" \
          -e "256 MB" \
          -j 4
    volumes:
      - qlever-index:/index
    ports:
      - "7001:7001"
    depends_on:
      qlever-indexer:
        condition: service_completed_successfully
    networks:
      - zac-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7001/api?query=ASK+%7B%7D"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── 3. FastAPI ──────────────────────────────────────────
  zac-api:
      build:
        context: .
        dockerfile: docker/Dockerfile
      container_name: zac-api
      restart: unless-stopped
      depends_on:
        qlever:
          condition: service_healthy
      ports:
        - "5432:5432"
      volumes:
        - ./config:/app/config:ro
        - .:/app
      environment:
        - QLEVER_HOST=qlever
        - QLEVER_PORT=7001
        - PYTHONUNBUFFERED=1
        - ZAC_BASE_PATH=${ZAC_BASE_PATH:-}
      networks:
        - zac-net
      command: uvicorn main:app --host 0.0.0.0 --port 5432 --reload

volumes:
  qlever-index:
    driver: local

networks:
  zac-net:
    driver: bridge