# ZAC Platform — Faceted Search Configuration
# Maps filter identifiers → SPARQL paths + UI labels
# Data model: CIDOC-CRM + Linked Art application profile
# Namespace: http://w3id.org/zac/ | CIDOC: http://www.cidoc-crm.org/cidoc-crm/

namespaces:
  zac:   "http://w3id.org/zac/"
  crm:   "http://www.cidoc-crm.org/cidoc-crm/"
  rdfs:  "http://www.w3.org/2000/01/rdf-schema#"
  xsd:   "http://www.w3.org/2001/XMLSchema#"
  aat:   "http://vocab.getty.edu/aat/"

# ─────────────────────────────────────────
# TAB 1 — EVENTI ASTA
# ─────────────────────────────────────────
eventi_asta:
  label_it: "Aste"
  label_en: "Auctions"
  description_it: "Analisi delle aste come eventi storici del mercato"
  description_en: "Analysis of auction events as historical market events"
  enabled: true
  primary_class: "crm:E7_Activity"

  # Route config — used by the generic browse router
  route:
    path: "/aste"
    active_tab: "aste"
    detail_query: "evento_item"
    results_query: "eventi_asta"
    count_query: "eventi_asta_count"
    detail_kind: "evento"
    icon: "ph ph-gavel"
    entity_label: "aste"
    # How to extract items from SPARQL result rows
    uri_var: "auction"
    slug_from_uri: true
    display:
      thumb_field: uri
      title:    { field: title, fallback: [label, doc_id, slug], class: row-title }
      meta:     { parts: [house, year], separator: " · ", class: row-meta }
      actions:
        - { kind: open,     label: "Apri →",      class: btn-apri }
        - { kind: external, field: zeri_url, label: "Scheda Zeri", icon: "ph ph-link", class: row-zeri-link }
    result_fields:
      thumb: "thumb"
      label:  "auctionLabel"
      language: "langLabel"
      illustrated: "illustrated"
      house:  "houseLabel"
      year:   "yearLabel"
      place:  "placeLabel"

    # Ordinamento — chiave param "sort" → frammento SPARQL ORDER BY
    sort_fields:
      date_asc:  "ASC(?yearLabel) ASC(?auctionLabel)"
      date_desc: "DESC(?yearLabel) DESC(?auctionLabel)"
      name_asc:  "ASC(?auctionLabel)"
      name_desc: "DESC(?auctionLabel)"
    default_sort: "date_asc"

    # Export CSV/JSON
    export_filename: "zac_aste"

  facets:
    organizzatore:
      label_it: "Organizzatore/Casa d'Asta"
      label_en: "Organisers/Auction House"
      type: "multiselect"
      ui_widget: "checkbox_list"

    banditore:
      label_it: "Banditore"
      label_en: "Auctioneer"
      type: "multiselect"
      ui_widget: "checkbox_list"
    
    periodo:
      label_it: "Data dell'asta"
      label_en: "Period (auction year)"
      type: "range"
      ui_widget: "range_slider"
      range:
        min: 1860
        max: 1940
        step: 1

    luogo:
      label_it: "Luogo dell'asta"
      label_en: "Place"
      type: "multiselect"
      ui_widget: "checkbox_list"

    collezione:
      label_it: "Collezione in vendita"
      label_en: "Collection for Sale"
      type: "multiselect"
      ui_widget: "checkbox_list"

    tipologia_oggetti:
      label_it: "Tipologia oggetti"
      label_en: "Object Types Sold"
      type: "multiselect"
      ui_widget: "checkbox_list"

    cronologia_oggetti:
      label_it: "Cronologia oggetti"
      label_en: "Object Chronology Sold"
      type: "multiselect"
      ui_widget: "checkbox_list"

# ─────────────────────────────────────────
# TAB 2 — CATALOGHI
# ─────────────────────────────────────────
cataloghi:
  label_it: "Cataloghi"
  label_en: "Catalogues"
  description_it: "Panoramica della storia del mercato attraverso i cataloghi d'asta"
  description_en: "Overview of market history through auction catalogues"
  enabled: true
  primary_class: "crm:E31_Document"

  route:
    path: "/cataloghi"
    active_tab: "catalogo"
    detail_query: "catalogo_item"
    results_query: "catalogo"
    count_query: "catalogo_count"
    detail_kind: "catalogo"
    icon: "ph ph-book-open-text"
    entity_label: "cataloghi"
    uri_var: "doc"
    slug_from_uri: true
    display:
      thumb_field: uri
      title:  { field: label, fallback: [title, slug], class: row-title }
      meta:   { parts: [house, year], separator: " · ", class: row-meta }
      badges:
        class: row-badges
        vals:
          - { field: language, transform: lingua_estesa, class: badge-pill }
          - { flag: illustrated, label: "Illustrato", class: "badge-pill badge-pill-accent" }
      actions:
        - { kind: open,     label: "Apri →", class: btn-apri }
        - { kind: external, field: zeri_url, label: "Scheda Zeri", icon: "ph ph-link", class: row-zeri-link }
    result_fields:
      thumb:      "thumb"
      zeri_url:   "zeriUrl"
      doc_id:     "docId"
      title:      "title"
      year:       "year"
      house:      "houseLabel"
      language:   "langLabel"
      illustrated: "illustrated"   

    # Ordinamento — chiave param "sort" → frammento SPARQL ORDER BY
    sort_fields:
      date_asc:  "ASC(?year) ASC(?docId)"
      date_desc: "DESC(?year) DESC(?docId)"
      name_asc:  "ASC(?title) ASC(?docId)"
      name_desc: "DESC(?title) DESC(?docId)"
    default_sort: "date_asc"

    # Export CSV/JSON
    export_filename: "zac_cataloghi"

  facets:
    autori:
      label_it: "Autore / Casa d'asta"
      label_en: "Authors / Auction House"
      type: "multiselect"
      ui_widget: "checkbox_list"

    anno_pubblicazione:
      label_it: "Anno di pubblicazione"
      label_en: "Publication Year"
      type: "range"
      ui_widget: "range_slider"
      range:
        min: 1860
        max: 1940
        step: 1

    luogo:
      label_it: "Luogo di pubblicazione"
      label_en: "Place of Publication"
      type: "multiselect"
      ui_widget: "checkbox_list"

    collezione:
      label_it: "Collezione in vendita"
      label_en: "Collection"
      type: "multiselect"
      ui_widget: "checkbox_list"

    lingua:
      label_it: "Lingua"
      label_en: "Language"
      type: "multiselect"
      ui_widget: "checkbox_list"

    # titolo:
    #   label_it: "Titolo"
    #   label_en: "Title"
    #   type: "text_search"
    #   ui_widget: "text_input"

    illustrazioni:
      label_it: "Illustrato"
      label_en: "Illustrated"
      type: "boolean"
      ui_widget: "toggle"
      values:
        "true": "Si"
        "false" : "No"

# ─────────────────────────────────────────
# TAB 3 — LOTTI
# ─────────────────────────────────────────
lotti:
  label_it: "Lotti"
  label_en: "Lots"
  description_it: "Ricerca per lotto d'asta"
  enabled: true
  primary_class: "la:Set"

  route:
    path: "/lotti"
    active_tab: "lotti"
    results_query: "lotto"
    count_query: "lotto_count"
    detail_kind: "lotto"  
    icon: "ph ph-image"
    entity_label: "lotti"
    uri_var: "lot"
    slug_from_uri: true
    display:
      thumb_field: uri
      title:    { field: title, fallback: [label, slug], class: row-title }
      subtitle: { field: author_label, class: row-subtitle }        
      badges:
        class: row-badges
        vals:
          - { field: type_label, class: badge-pill }
          - { field: author_label, class: badge-pill }  # generico, prede sia scuole che artisti
      footer:   { field: auction_label, class: "row-footer row-meta-auction" }
      actions:
        - { kind: open,  label: "Apri →", class: btn-apri }
        - { kind: cross, route: /aste, slug_field: auction_slug, label: "Sfoglia il catalogo →", class: row-catalog-link }
        - { kind: external, field: zeri_url, label: "Scheda Zeri", icon: "ph ph-link", class: row-zeri-link }
    result_fields:
      title:         "title"
      label:         "label"
      author_label:  "authorLabel" # generico, prede sia scuole che artisti
      img:           "img"
      type_label:    "typeLabel"
      auction_label: "auctionLabel"
      auction_slug:  "auctionSlug"
    sort_fields:
      name_asc:  "ASC(?title)"
      name_desc: "DESC(?title)"
    default_sort: "name_asc"
    export_filename: "zac_lotti"

  facets:
    scuola:
      label_it: "Scuola"
      label_en: "School"
      type: "multiselect"
      ui_widget: "checkbox_tree"  

    artista:
      label_it: "Artista"
      label_en: "Artist"
      type: "multiselect"
      ui_widget: "checkbox_list"    

    tipologia:
      label_it: "Tipologia"
      label_en: "Object type"
      type: "multiselect"
      ui_widget: "checkbox_list"

    # cronologia: BLOCCATA — nessun path data/periodo sul lotto TBD
    # cronologia:
    #   label_it: "Cronologia"
    #   type: "range"
    #   ui_widget: "range_slider"
    #   range: { min: 1860, max: 1940, step: 1 }

# ─────────────────────────────────────────
# UI Configuration
# ─────────────────────────────────────────
ui:
  results_per_page: 50
  max_facet_values: 50
  debounce_ms: 300